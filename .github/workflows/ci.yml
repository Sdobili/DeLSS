name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pipx install ruff
      - name: Generated code is up to date
        run: python3 tools/gen.py --check
      - run: npx eslint .
      - run: npx prettier --check .
      - run: ruff check tools && ruff format --check tools

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Golden-image tests (WebGL2 on SwiftShader)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: test-results/
