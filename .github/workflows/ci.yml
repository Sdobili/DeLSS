name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pipx install ruff
      - name: Generated code is up to date
        run: python3 tools/gen.py --check
      - run: npx eslint .
      - run: npx prettier --check .
      - run: ruff check tools && ruff format --check tools

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Golden-image tests (WebGL2 on SwiftShader)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: test-results/

  cpp:
    runs-on: ubuntu-24.04
    env:
      # Force Mesa's CPU rasterizer: no GPU on the runner.
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Install EGL / GLES and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl-dev libgles-dev libegl-mesa0 \
            libgl1-mesa-dri ninja-build clang-format clang-tidy \
            libx11-dev libxcomposite-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libayatana-appindicator3-dev xvfb xdotool imagemagick x11-utils
      - run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDELSS_BUILD_OVERLAY=ON
      - run: cmake --build build
      - name: Golden tests (GLES + desktop GL) and the X11 overlay end-to-end test on Xvfb
        run: ctest --test-dir build --output-on-failure
      - name: clang-format
        run: |
          clang-format --dry-run --Werror cpp/include/delss/delss.hpp cpp/include/delss/types.hpp cpp/include/delss/gl.hpp cpp/src/*.cpp cpp/apps/*.[ch]pp cpp/tests/*.cpp \
            $(git ls-files 'cpp/overlay/*.cpp' 'cpp/overlay/*.hpp' 'cpp/overlay/*.mm')
      - name: clang-tidy
        run: clang-tidy -p build cpp/src/delss.cpp cpp/src/gl.cpp cpp/apps/*.cpp cpp/tests/*.cpp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-golden-output
          path: |
            build/golden-cpp/
            build/golden-cpp_desktop/
            build/overlay/e2e/
