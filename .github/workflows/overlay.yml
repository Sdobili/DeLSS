name: Overlay

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: delss-overlay-windows-x64
          - os: macos-latest
            artifact: delss-overlay-macos-arm64
          - os: ubuntu-latest
            artifact: delss-overlay-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl-dev libgles-dev ninja-build \
            libx11-dev libxcomposite-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libayatana-appindicator3-dev
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DDELSS_BUILD_OVERLAY=ON -DDELSS_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests (hotkey state machine, settings, capture-to-texture conversion, HUD)
        run: ctest --test-dir build -C Release -R overlay_core --output-on-failure
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist && cp build/overlay/Release/delss-overlay.exe dist/
          cp LICENSE dist/
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist && cp -R "build/overlay/DeLSS Overlay.app" dist/
          codesign --force --deep -s - "dist/DeLSS Overlay.app"
          cp LICENSE dist/
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist && cp build/overlay/delss-overlay dist/ && cp LICENSE dist/
          cp -r tools/compositor dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "${{ matrix.artifact }}.zip" ./dist/*; else (cd dist && zip -qry "../${{ matrix.artifact }}.zip" .); fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.artifact }}.zip
